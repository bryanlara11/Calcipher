# Render Blueprint: one web service (API + built frontend) and a pgvector-capable Postgres.
# No API keys are set here, so map discovery uses OpenStreetMap only. Add GOOGLE_PLACES_API_KEY
# or GEMINI_API_KEY in the Render dashboard if you want them.
services:
  - type: web
    name: calcipher
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: calcipher-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "[]"
      # Public Overpass mirrors can take ~30 s to stream a 2 km result to a cloud host.
      - key: OVERPASS_TIMEOUT_S
        value: "45"

databases:
  - name: calcipher-db
    plan: free
    region: singapore
    databaseName: calcipher
    user: calcipher
    postgresMajorVersion: "16"
